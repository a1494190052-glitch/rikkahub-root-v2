name: Build RikkaHub Root APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/Sdk/platforms
            ~/.android/Sdk/build-tools
            ~/.android/Sdk/ndk
            ~/.android/Sdk/platform-tools
            ~/.android/Sdk/cmdline-tools
          key: android-sdk-v4-${{ hashFiles('.github/workflows/build-apk.yml') }}
          restore-keys: android-sdk-v4-

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          "$SDKM" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;36.1.0" "ndk;28.2.13676358"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-root-arm64
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
